# https://render.com/docs/blueprint-spec
# Conecte o repo GitHub: Dashboard → New Blueprint → VandinDev221/SaaS-B2B
services:
  - type: web
    name: flowos-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /v1/observability/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: flowos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: flowos-redis
          type: redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://flowos-web.onrender.com
      - key: PUBLIC_WEB_URL
        value: https://flowos-web.onrender.com
      - key: EVOLUTION_API_URL
        value: https://evolution.example.com
      - key: EVOLUTION_API_KEY
        generateValue: true
      - key: EVOLUTION_WEBHOOK_SECRET
        generateValue: true
      - key: ALLOW_WHATSAPP_MOCK
        value: "false"
      - key: ALLOW_PIX_MOCK
        value: "false"
      - key: AUTOMATION_ENABLED
        value: "true"

  - type: web
    name: flowos-web
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_URL
        value: https://flowos-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://flowos-api.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: FLOWOS
      - key: COOKIE_SECURE
        value: "true"

  - type: redis
    name: flowos-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: flowos-db
    plan: free
    databaseName: flowos
    user: flowos
