# https://render.com — alternativa ao Railway (conecte o repo GitHub no dashboard)
services:
  - type: web
    name: flowos-api
    runtime: docker
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /v1/observability/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: flowos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: flowos-redis
          type: redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        generateValue: true
      - key: EVOLUTION_WEBHOOK_SECRET
        generateValue: true
      - key: ALLOW_WHATSAPP_MOCK
        value: "false"
      - key: ALLOW_PIX_MOCK
        value: "false"

  - type: redis
    name: flowos-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: flowos-db
    plan: free
    databaseName: flowos
    user: flowos
