# https://render.com/docs/blueprint-spec
# Postgres: Neon (console.neon.tech) — evita limite de 1 DB free no Render.
# Redis: Render Key Value (1 free por conta) ou existente na conta.
# Apos Blueprint: flowos-api → Environment → DATABASE_URL (Neon) + REDIS_URL.
services:
  - type: web
    name: flowos-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /v1/observability/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://flowos-web.onrender.com
      - key: PUBLIC_WEB_URL
        value: https://flowos-web.onrender.com
      - key: EVOLUTION_API_URL
        value: https://evolution.example.com
      - key: EVOLUTION_API_KEY
        generateValue: true
      - key: EVOLUTION_WEBHOOK_SECRET
        generateValue: true
      - key: ALLOW_WHATSAPP_MOCK
        value: "false"
      - key: ALLOW_PIX_MOCK
        value: "false"
      - key: AUTOMATION_ENABLED
        value: "true"

  - type: web
    name: flowos-web
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_URL
        value: https://flowos-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://flowos-api.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: FLOWOS
      - key: COOKIE_SECURE
        value: "true"
