# https://render.com/docs/blueprint-spec
# Postgres: Neon (console.neon.tech)
# Redis: Upstash (console.upstash.com) — URL rediss://
# Apos Blueprint: flowos-api → DATABASE_URL + REDIS_URL
# WhatsApp: flowos-evolution → DATABASE_CONNECTION_URI (Neon + schema=evolution)
services:
  - type: web
    name: flowos-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /v1/observability/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: EVOLUTION_API_URL
        value: http://flowos-evolution:8080
      - key: EVOLUTION_API_KEY
        generateValue: true
      - key: EVOLUTION_WEBHOOK_SECRET
        generateValue: true
      - key: ALLOW_WHATSAPP_MOCK
        value: "false"
      - key: ALLOW_PIX_MOCK
        value: "false"
      - key: WHATSAPP_PROVIDER
        value: evolution
      - key: EVOLUTION_INSTANCE
        value: flowos
      - key: AUTOMATION_ENABLED
        value: "true"
      - key: WHATSAPP_INBOX_SYNC_ENABLED
        value: "true"
      - key: WHATSAPP_INBOX_SYNC_INTERVAL_MS
        value: "8000"

  - type: web
    name: flowos-evolution
    runtime: image
    plan: free
    image:
      url: docker.io/evoapicloud/evolution-api:v2.3.7
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"
      - key: AUTHENTICATION_API_KEY
        fromService:
          type: web
          name: flowos-api
          envVarKey: EVOLUTION_API_KEY
      - key: SERVER_URL
        value: https://flowos-evolution.onrender.com
      - key: LOG_LEVEL
        value: ERROR
      - key: DEL_INSTANCE
        value: "false"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: FLOWOS
      - key: WPP_LID_MODE
        value: "false"
      - key: QRCODE_LIMIT
        value: "30"
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: CACHE_REDIS_PREFIX_KEY
        value: flowos

  - type: web
    name: flowos-web
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_URL
        value: http://flowos-api:4000
      - key: NEXT_PUBLIC_API_URL
        value: https://sua-api.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: FLOWOS
      - key: COOKIE_SECURE
        value: "true"
